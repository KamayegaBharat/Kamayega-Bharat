<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamayega Bharat | Seeker Console</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-messaging-compat.js"></script>

    <style>
        :root {
            --brand-blue: #0047FF;
            --bg-light: #F8FAFC;
            --glass-white: rgba(255, 255, 255, 0.85);
            --text-dark: #0F172A;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background: var(--glass-white);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--brand-blue);
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .nav-item {
            padding: 14px 18px;
            margin: 6px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #64748B;
            font-weight: 600;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--brand-blue);
            color: white;
        }

        /* --- CONTENT AREA --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .section { display: none; }
        .section.active { display: block; animation: slideUp 0.3s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
        }

        /* --- INBOX & G-MEET --- */
        .chat-container {
            height: 450px;
            background: #f1f5f9;
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bubble { max-width: 75%; padding: 12px 16px; border-radius: 15px; font-size: 14px; }
        .bubble.sent { align-self: flex-end; background: var(--brand-blue); color: white; border-bottom-right-radius: 4px; }
        .bubble.received { align-self: flex-start; background: white; color: var(--text-dark); border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }

        .meet-card {
            background: #ffffff;
            border: 2px dashed var(--brand-blue);
            padding: 15px;
            border-radius: 14px;
            margin-top: 10px;
            text-align: center;
        }

        .btn {
            background: var(--brand-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand-logo">BHARAT <span style="font-weight:300">CONSOLE</span></div>
        <div class="nav-item active" onclick="showSection('market')">Marketplace</div>
        <div class="nav-item" onclick="showSection('portfolio')">Pro Portfolio</div>
        <div class="nav-item" onclick="showSection('tracker')">App Tracker</div>
        <div class="nav-item" onclick="showSection('inbox')">Unified Inbox</div>
        <div class="nav-item" onclick="showSection('settings')">Settings</div>
        
        <div style="margin-top:auto">
            <p id="user-mail" style="font-size:12px; color:#64748B"></p>
            <button onclick="logout()" style="background:none; border:none; color:#EF4444; cursor:pointer; font-weight:bold">Sign Out →</button>
        </div>
    </aside>

    <main class="main-content">
        <section id="market" class="section active">
            <h2>Marketplace</h2>
            <div id="jobs-container"></div>
        </section>

        <section id="portfolio" class="section">
            <h2>Pro Portfolio</h2>
            <div class="glass-card">
                <p>Update your Bio</p>
                <textarea id="user-bio" style="width:100%; height:120px; border-radius:10px; border:1px solid #ddd; padding:10px"></textarea>
                <br><br>
                <button onclick="updateBio()" class="btn">Save Portfolio</button>
            </div>
        </section>

        <section id="inbox" class="section">
            <h2>Unified Inbox</h2>
            <div class="glass-card">
                <div id="chat-box" class="chat-container"></div>
                <div style="margin-top:15px; display:flex; gap:10px">
                    <input type="text" id="chat-input" placeholder="Type message..." style="flex:1; padding:12px; border-radius:10px; border:1px solid #ddd">
                    <button onclick="sendChat()" class="btn">Send</button>
                </div>
            </div>
        </section>

        <section id="settings" class="section">
            <h2>Settings</h2>
            <div class="glass-card">
                <p><strong>Notifications</strong></p>
                <button onclick="enableNotifications()" class="btn">Enable Browser Alerts</button>
            </div>
        </section>
    </main>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjXP4yQWDyCu4p78iA5aKrqICZLt_yxtk",
            authDomain: "kamayega-bharat.firebaseapp.com",
            projectId: "kamayega-bharat",
            storageBucket: "kamayega-bharat.appspot.com",
            messagingSenderId: "595460672260",
            appId: "1:595460672260:web:6584856313e2d740805e51"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Auth Guard ---
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('user-mail').innerText = user.email;
                fetchUserData(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        // --- Navigation ---
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // --- G-Meet Link Detector ---
        function formatMsg(text) {
            const meetUrl = /(https?:\/\/meet\.google\.com\/[a-z0-9-]+)/g;
            if (meetUrl.test(text)) {
                return text.replace(meetUrl, (url) => `
                    <div class="meet-card">
                        <p style="margin:0; font-weight:bold; color:var(--brand-blue)">Video Interview Room</p>
                        <a href="${url}" target="_blank" class="btn" style="margin-top:10px; font-size:12px">Join G-Meet Now</a>
                    </div>
                `);
            }
            return text;
        }

        // --- Profile Actions ---
        async function fetchUserData(uid) {
            const doc = await db.collection('users').doc(uid).get();
            if (doc.exists) {
                document.getElementById('user-bio').value = doc.data().bio || "";
            }
        }

        async function updateBio() {
            const bio = document.getElementById('user-bio').value;
            await db.collection('users').doc(auth.currentUser.uid).update({ bio: bio });
            alert("Portfolio Synced!");
        }

        function logout() { auth.signOut(); }
    </script>
</body>
</html>
